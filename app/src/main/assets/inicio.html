<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velox</title>
<style>
:root { --bg:#070B14; --sup:#0D1530; --campo:#141E40; --c1:#22d3ee; --c2:#a78bfa; --tx:#fff; --su:#8fa0cf; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: radial-gradient(circle at 50% 18%, color-mix(in srgb, var(--c1) 22%, var(--bg)) 0%, var(--bg) 62%); color: var(--tx); font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 8vh 20px 40px; min-height: 100vh; }
.marca { width: min(78vw, 340px); height: auto; filter: drop-shadow(0 0 18px color-mix(in srgb, var(--c1) 55%, transparent)); }
h1 { margin: 6px 0 0; font-size: clamp(34px, 9vw, 54px); letter-spacing: .16em; padding-left: .16em; }
.sub { margin: 4px 0 26px; letter-spacing: .6em; padding-left: .6em; font-size: 14px; color: var(--su); }
form { width: min(100%, 560px); }
input { width: 100%; min-height: 52px; border-radius: 26px; border: 1.5px solid color-mix(in srgb, var(--c1) 45%, transparent); background: var(--campo); color: var(--tx); font-size: 17px; padding: 0 22px; outline: none; }
input:focus { border-color: var(--c1); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c1) 25%, transparent); }
input::placeholder { color: var(--su); }
.titulo { margin: 34px 0 12px; font-size: 13px; letter-spacing: .2em; color: var(--su); }
.sites { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; width: min(100%, 460px); }
.sites a { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: var(--su); font-size: 12px; min-height: 44px; }
.sites span { width: 58px; height: 58px; border-radius: 14px 4px 14px 4px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; color: #fff; }
</style>
</head>
<body>
<svg class="marca" viewBox="-20 -20 400 220" role="img" aria-label="VX">
<defs>
<g id="vx"><path d="M0 0 L56 0 L100 112 L144 0 L200 0 L128 170 L72 170 Z"/><path d="M162 0 L220 0 L362 170 L304 170 Z"/><path d="M304 0 L362 0 L220 170 L162 170 Z"/></g>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" id="s1" stop-color="#22d3ee"/><stop offset="1" id="s2" stop-color="#a78bfa"/></linearGradient>
</defs>
<g id="sombra" fill="#1b2a63"></g>
<use href="#vx" fill="url(#g)" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/>
</svg>
<h1>VELOX</h1>
<div class="sub">SEARCH</div>
<form id="f"><input id="q" type="search" placeholder="Pesquisar ou digitar endereço" autocomplete="off" aria-label="Pesquisar ou digitar endereço"></form>
<div class="titulo">SITES</div>
<nav class="sites" aria-label="Sites">
<a href="https://www.reddit.com"><span style="background:#ff4500">R</span>Reddit</a>
<a href="https://www.twitch.tv"><span style="background:#7b2fbe">T</span>Twitch</a>
<a href="https://discord.com"><span style="background:#5865f2">D</span>Discord</a>
<a href="https://www.youtube.com"><span style="background:#e00000">Y</span>YouTube</a>
<a href="https://github.com"><span style="background:#24292f">G</span>GitHub</a>
<a href="https://store.steampowered.com"><span style="background:#1b2838">S</span>Steam</a>
<a href="https://www.wikipedia.org"><span style="background:#4a4a4a">W</span>Wikipédia</a>
<a href="https://web.whatsapp.com"><span style="background:#1f9d55">W</span>WhatsApp</a>
</nav>
<script>
(function () {
  var p = new URLSearchParams(location.search), r = document.documentElement.style;
  var m = { bg: '--bg', sup: '--sup', campo: '--campo', c1: '--c1', c2: '--c2', tx: '--tx', su: '--su' };
  Object.keys(m).forEach(function (k) { var v = p.get(k); if (v && /^[0-9a-fA-F]{6}$/.test(v)) r.setProperty(m[k], '#' + v); });
  if (/^[0-9a-fA-F]{6}$/.test(p.get('c1') || '')) document.getElementById('s1').setAttribute('stop-color', '#' + p.get('c1'));
  if (/^[0-9a-fA-F]{6}$/.test(p.get('c2') || '')) document.getElementById('s2').setAttribute('stop-color', '#' + p.get('c2'));
  var s = document.getElementById('sombra'), x = '';
  for (var i = 9; i >= 1; i--) x += '<use href="#vx" x="' + i + '" y="' + i + '"/>';
  s.innerHTML = x;
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = document.getElementById('q').value.trim();
    if (q) location.href = 'velox://buscar?q=' + encodeURIComponent(q);
  });
})();
</script>
</body>
</html>
