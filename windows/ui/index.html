<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'">
<title>Velox</title>
<link rel="stylesheet" href="../inicio/vgx.css">
<link rel="stylesheet" href="barra.css">
</head>
<body>
<div id="fundo"></div>
<div id="topo"><button id="chevron" class="ic" title="Ações de abas (Ctrl+Shift+A)" aria-label="Ações de abas"></button><div id="abas"></div></div>
<div id="lateral" hidden><div id="lateral-abas"></div><button id="lateral-nova" type="button">+ Nova aba</button></div>
<div id="aviso" hidden><span id="aviso-texto"></span><button id="aviso-abrir" type="button" hidden>Abrir pasta</button></div>
<div id="dock">
  <div id="enderecos">
    <div id="logo" title="Velox" data-vgx data-emblema="1" data-brilho="0"></div>
    <div id="campo" class="corte" data-corte="0,0,10,0"><span id="cadeado" title=""></span><input id="endereco" type="text" spellcheck="false" autocomplete="off" placeholder="Pesquise ou digite um endereço"></div>
    <div id="busca" hidden><input id="busca-texto" type="text" spellcheck="false" placeholder="Buscar na página"><span id="busca-n"></span><button id="busca-ant" title="Anterior">↑</button><button id="busca-prox" title="Próximo">↓</button><button id="busca-fechar" title="Fechar (Esc)">×</button></div>
    <button id="estrela" class="ic" title="Favoritar (Ctrl+D)" aria-label="Favoritar"></button>
    <button id="chave" class="ic" title="Senhas salvas" aria-label="Senhas"></button>
    <button id="baixados" class="ic" title="Downloads (Ctrl+J)" aria-label="Downloads"></button>
    <button id="menu" class="ic" title="Mais opções" aria-label="Mais opções"></button>
  </div>
  <div id="botoes" class="corte" data-corte="12,0,12,0">
    <button id="voltar" class="ic" title="Voltar (Alt+←)" aria-label="Voltar"></button>
    <button id="avancar" class="ic" title="Avançar (Alt+→)" aria-label="Avançar"></button>
    <button id="inicio" class="ic" title="Início" aria-label="Início"></button>
    <button id="recarregar" class="ic" title="Recarregar (F5)" aria-label="Recarregar"></button>
    <div id="favoritos"></div>
    <button id="ajustes" class="ic" title="Ajustes" aria-label="Ajustes"></button>
    <span id="gamer-caixa"><button id="gamer" class="corte" data-corte="12,0,12,0" title="Modo gamer (Ctrl+Shift+G)" aria-label="Modo gamer"><span class="inc"></span><i></i></button></span>
  </div>
</div>
<script src="../inicio/vgx.js"></script>
<script src="barra.js"></script>
</body>
</html>
