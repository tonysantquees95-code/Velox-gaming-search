<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Downloads</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
:root{--c1:#22d3ee;--c2:#a78bfa;--bg:#070b14;--sup:#0d1530;--campo:#141e40;--su:#8fa0cf;--tx:#fff}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px "Segoe UI",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:22px 16px}
h1{font-size:22px;margin:0 0 4px;color:var(--c1)}
.topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
button{background:var(--campo);color:var(--tx);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
button:hover{border-color:var(--c1)}
.item{background:var(--sup);border:1px solid color-mix(in srgb,var(--c1) 25%,transparent);border-radius:12px;padding:12px 14px;margin:10px 0}
.nome{font-weight:600;word-break:break-all}.info{color:var(--su);font-size:12px;margin:4px 0 8px}
.barra{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2))}
.acoes{display:flex;gap:8px;margin-top:10px}.vazio{color:var(--su);text-align:center;padding:40px 0}
</style><script src="tema.js"></script></head><body><main>
<div class="topo"><div><h1>Downloads</h1><div class="info" style="margin:0">Arquivos baixados no Velox</div></div><button id="limpar">Limpar lista</button></div>
<div id="lista"></div></main>
<script src="downloads.js"></script></body></html>
