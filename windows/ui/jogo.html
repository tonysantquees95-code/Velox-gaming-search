<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Game bar</title>
<link rel="stylesheet" href="jogo.css">
</head>
<body>
<div id="barra">
  <button data-a="voltar" data-i="voltar" title="Voltar"></button>
  <button data-a="recarregar" data-i="recarregar" title="Recarregar"></button>
  <button data-a="captura" data-i="captura" id="b-captura" title="Captura de tela"></button>
  <button data-a="som" data-i="som" id="b-som" title="Som da aba"></button>
  <button data-a="bloqueio" data-i="escudo" id="b-bloqueio" title="Bloqueador de anúncios"></button>
  <button data-a="posicao" data-i="lado" title="Mudar de lado (direita, esquerda, cima, baixo)"></button>
  <button data-a="recolher" data-i="recolher" id="b-recolher" title="Recolher a barra"></button>
  <button data-a="sair" data-i="sair" title="Sair do modo gamer (Ctrl+Shift+G)"></button>
</div>
<script src="jogo.js"></script>
</body>
</html>
