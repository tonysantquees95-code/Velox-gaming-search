<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Game bar</title>
<link rel="stylesheet" href="jogo.css">
</head>
<body>
<div id="barra">
  <button data-a="voltar" title="Voltar">‹</button>
  <button data-a="recarregar" title="Recarregar">⟳</button>
  <button data-a="captura" id="b-captura" title="Captura de tela">📷</button>
  <button data-a="som" id="b-som" title="Som da aba">🔊</button>
  <button data-a="bloqueio" id="b-bloqueio" title="Bloqueador de anúncios">🛡</button>
  <button data-a="posicao" title="Mudar de lado (direita, esquerda, cima, baixo)">⇄</button>
  <button data-a="recolher" id="b-recolher" title="Recolher a barra">⟩</button>
  <button data-a="sair" class="sair" title="Sair do modo gamer (Ctrl+Shift+G)">✕</button>
</div>
<script src="jogo.js"></script>
</body>
</html>
